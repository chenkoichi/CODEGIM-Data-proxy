name: Daily Fetch AIUB Data

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫程式碼
        uses: actions/checkout@v4  # <-- 這裡更新為 v4

      - name: 建立 Python 環境
        uses: actions/setup-python@v5 # <-- 這裡更新為 v5
        with:
          python-version: '3.x'

      - name: 執行 Python 下載腳本
        run: python fetch_data.py

      - name: 將新資料提交並推回儲存庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update daily GIM data" || echo "No changes to commit"
          git push
