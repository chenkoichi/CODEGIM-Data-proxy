name: Fetch AIUB Data (API Trigger)

on:
  workflow_dispatch:
    inputs:
      target_year:
        description: '指定年份 (如 2026)'
        required: true
        type: string
      target_doy:
        description: '指定年積日 (如 203)'
        required: true
        type: string
      target_types:
        description: '指定下載類型 (逗號分隔，如 GIM,DST)'
        required: false
        type: string
        default: 'ALL'

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    env:
      TARGET_YEAR: ${{ github.event.inputs.target_year }}
      TARGET_DOY: ${{ github.event.inputs.target_doy }}
      TARGET_TYPES: ${{ github.event.inputs.target_types }}
    steps:
      - name: 檢出儲存庫程式碼
        uses: actions/checkout@v4

      - name: 建立 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 執行 Python 下載腳本
        run: python fetch_data.py

      - name: 將新資料提交並推回儲存庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update observation data" || echo "No changes to commit"
          git push
